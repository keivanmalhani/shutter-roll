[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shutter-roll"
version = "0.1.0"
description = "Inject film stock, camera, ISO, roll and frame metadata into scanned negatives, with contact sheets."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Keivan Malhani" }]
requires-python = ">=3.11"
keywords = ["film-photography", "exif", "metadata", "scanning", "analog", "lightroom"]
dependencies = [
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shutter-roll = "shutter_roll.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The suite imports helpers as `from tests.conftest import ...`, which needs the
# repo root on sys.path. `python -m pytest` adds the current directory for you
# and the bare `pytest` console script does not, and the workflow runs the bare
# one, so CI failed with collection errors and zero tests executed while every
# hand run looked green. Setting it here means both invocations behave the same.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
